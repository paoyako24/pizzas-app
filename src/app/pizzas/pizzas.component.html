<div class="menu-container">
  <h1>🍕 Menú de Pizzas</h1>

  <!-- Pizza Pepperoni -->
  <div class="pizza-card">
    <img src="assets/pizzas/pepperoni.jpg" alt="Pizza Pepperoni">
    <h2>Pepperoni</h2>
    <button (click)="mostrarDetalles('pepperoni')">
      {{ detallesVisibles.pepperoni ? 'Ocultar detalles' : 'Mostrar detalles' }}
    </button>

    <div *ngIf="detallesVisibles.pepperoni" class="pizza-detalles">
      <p>Ingredientes: pepperoni, queso mozzarella, salsa de tomate y orégano.</p>
      <p>Precio: $180 MXN</p>
    </div>
  </div>

  <!-- Pizza Vegetariana -->
  <div class="pizza-card">
    <img src="assets/pizzas/vegetariana.jpg" alt="Pizza Vegetariana">
    <h2>Vegetariana</h2>
    <button (click)="mostrarDetalles('vegetariana')">
      {{ detallesVisibles.vegetariana ? 'Ocultar detalles' : 'Mostrar detalles' }}
    </button>

    <div *ngIf="detallesVisibles.vegetariana" class="pizza-detalles">
      <p>Ingredientes: pimientos, champiñones, aceitunas y queso.</p>
      <p>Precio: $160 MXN</p>
    </div>
  </div>
</div>
